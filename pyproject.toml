[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ismp3"
version = "0.1.0"
description = "محوّل أي وسائط إلى MP3 بأقل حجم — واجهة عربية، CLI وخادم محلي"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ilyas1435" }]
keywords = ["mp3", "yt-dlp", "ffmpeg", "audio", "converter", "termux", "replit", "arabic"]
classifiers = [
  "Environment :: Console",
  "Environment :: Web Environment",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Conversion",
]
dependencies = [
  "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
ia = ["internetarchive>=4.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
ismp3 = "ismp3.cli:main"

[project.urls]
Homepage = "https://github.com/ilyas1435/ismp3"
Issues = "https://github.com/ilyas1435/ismp3/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ismp3 = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
